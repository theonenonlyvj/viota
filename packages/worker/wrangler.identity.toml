name = "vgames-identity"
main = "src/identity-entry.ts"
compatibility_date = "2025-04-17"

# The standalone VGames Identity service: a SECOND deployable built from this
# same package that serves ONLY the identity surface (/auth/*, /claim,
# /admin/merge, /health) via the shared `routeIdentity` router. It has NO
# Durable Object, NO [[migrations]], and NO cron triggers — it never touches
# gameplay; it only reads/writes the accounts/devices tables in the SHARED D1.
#
# Deploy with:  wrangler deploy -c wrangler.identity.toml
# (see /DEPLOY.md → "VGames Identity service"). viota-worker keeps serving
# identity during the transition; both bind the SAME D1 below.

# SAME D1 as viota-worker (wrangler.toml): the two services share one accounts
# store. binding/name/id are identical on purpose.
[[d1_databases]]
binding = "DB"
database_name = "viota"
database_id = "f777f1c7-8ee0-4520-8a87-83a8f6f387a9"

# JWT_SECRET is DELIBERATELY NOT set here. Set it in PRODUCTION via
# `wrangler secret put JWT_SECRET -c wrangler.identity.toml` (32+ byte random) —
# a [vars] entry would OVERWRITE that remote secret on every deploy. It MUST be
# the SAME value as viota-worker's JWT_SECRET so tokens are interchangeable
# across the two services (a token minted by one must verify on the other).
# Unset, the request-time guard fail-closes with 503 (same as the main worker);
# for local `wrangler dev -c wrangler.identity.toml` put a real 32+ byte
# JWT_SECRET in a git-ignored `.dev.vars`. Rotating JWT_SECRET MUST be done on
# BOTH services together (see /DEPLOY.md).
#
# CLIENT_ORIGIN is DELIBERATELY UNSET here: unset => CORS falls back to a
# permissive `*` (fine for local dev). In PRODUCTION set the exact browser
# origin allowlist via `wrangler secret put CLIENT_ORIGIN -c wrangler.identity.toml`
# (comma-separated: one origin per game client that calls identity). See src/cors.ts.
#
# ADMIN_JWT_SECRET (gates POST /admin/merge) is ALSO DELIBERATELY NOT set here —
# a SEPARATE secret from JWT_SECRET so a leaked player token can never authorize
# a merge. Unset (the default), every /admin/merge request 401s (fail-closed);
# set it ONLY when an admin merge is actually needed via
# `wrangler secret put ADMIN_JWT_SECRET -c wrangler.identity.toml`.
