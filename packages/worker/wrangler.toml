name = "viota-worker"
main = "src/index.ts"
compatibility_date = "2025-04-17"

# One Durable Object per game. MUST be new_sqlite_classes (the SQLite-backed
# class is the one available on the Workers Free plan; new_classes requests the
# paid KV-backed class).
[[durable_objects.bindings]]
name = "GAME_DO"
class_name = "GameDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

# D1 analytics archive (Phase 5). The DO SQLite copy is the authoritative live
# truth; D1 is the durable, queryable, rebuildable archive written through via
# ctx.waitUntil. Local dev + Miniflare need only this binding (a local SQLite is
# provisioned automatically).
#
# PRODUCTION (see /DEPLOY.md): run `wrangler d1 create viota` ONCE and REPLACE the
# database_id placeholder below with the real id it prints, then apply the schema
# via `wrangler d1 migrations apply viota --remote` (migrations/0001_init.sql) or
# `wrangler d1 execute viota --remote --file=schema/d1.sql`.
[[d1_databases]]
binding = "DB"
database_name = "viota"
database_id = "f777f1c7-8ee0-4520-8a87-83a8f6f387a9"

# IDENTITY_DB (VGames identity code/data split, Step 1 — A11): a SECOND binding
# pointed at the SAME database_id as DB above (two bindings, one DB, on
# purpose). Game code reads identity data (canonicalization, cross-DB name
# lookups, the merge reconciler) through THIS binding rather than DB, so the
# access path is already correct before the data itself ever moves. Step 4 of
# the split (data split) changes only the database_id here (to the new
# standalone `vgames-identity` D1) — no code changes at that point.
#
# Locally/in tests, vitest-pool-workers provisions this as a SEPARATE local D1
# from DB (Miniflare keys local storage by binding name, not database_id) —
# that is DESIRABLE: it makes every test exercise the POST-SPLIT access
# pattern (two independent stores) even though production is still one
# physical database until Step 4. See src/d1/schema.ts (applyGameSchema /
# applyIdentitySchema) and test/helpers.ts.
[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "viota"
database_id = "f777f1c7-8ee0-4520-8a87-83a8f6f387a9"

# Cron sweep (1-min is the Cloudflare floor): pokes stale active games so their
# DO alarm/heal path re-drives/abandons them and drains any unflushed archive.
[triggers]
crons = ["* * * * *"]

# Persisted Workers Logs (Cloudflare dashboard → Workers → viota-worker → Logs),
# matching wrangler.identity.toml. Without this, console output is visible only
# via a live `wrangler tail`; with it, auth/gameplay failures are diagnosable
# after the fact. Takes effect on the next `wrangler deploy`.
[observability]
enabled = true
head_sampling_rate = 1

# JWT_SECRET is DELIBERATELY NOT set here. In PRODUCTION it MUST be set via
# `wrangler secret put JWT_SECRET` (32+ byte random) — a [vars] entry with the
# same name would OVERWRITE that remote secret on every `wrangler deploy`
# (wrangler warns, then replaces). Unset locally, the request-time secret guard
# fail-closes with 503, same as the old invalid placeholder did; for local
# `wrangler dev` put a real 32+ byte JWT_SECRET in a git-ignored `.dev.vars`.
#
# CLIENT_ORIGIN is DELIBERATELY UNSET here: unset => CORS falls back to a
# permissive `*`, which is what you want for local `wrangler dev` (any localhost
# origin). In PRODUCTION set it to the EXACT Cloudflare Pages URL (e.g.
# https://viota.pages.dev) via `wrangler secret put CLIENT_ORIGIN` so CORS is
# pinned to that one origin. workers.dev and pages.dev are DIFFERENT origins — if
# CLIENT_ORIGIN is left unset in prod, the browser still works (`*`) but the pin
# is lost; setting it is the intended, safer prod posture. See src/cors.ts.
#
# ADMIN_JWT_SECRET (VGames identity, Phase A12) is ALSO DELIBERATELY NOT set
# here — no value, comment only. It gates POST /admin/merge (src/identity/admin.ts)
# and is a SEPARATE secret from JWT_SECRET: a leaked/compromised player token
# must never be able to authorize an account merge. Unset (the default), every
# /admin/merge request 401s (fail-closed) — set it ONLY when an admin merge is
# actually needed via `wrangler secret put ADMIN_JWT_SECRET` (32+ byte random,
# independent of JWT_SECRET), mint a short-lived {aud:'vgames-admin'} HS256
# token signed with it out-of-band, and consider rotating it out again after.
