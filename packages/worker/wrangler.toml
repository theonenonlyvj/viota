name = "viota-worker"
main = "src/index.ts"
compatibility_date = "2025-04-17"

# One Durable Object per game. MUST be new_sqlite_classes (the SQLite-backed
# class is the one available on the Workers Free plan; new_classes requests the
# paid KV-backed class).
[[durable_objects.bindings]]
name = "GAME_DO"
class_name = "GameDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameDO"]

# JWT_SECRET: local-dev placeholder ONLY, and DELIBERATELY invalid (< 32 bytes)
# so the request-time secret guard fires (503) if you `wrangler dev` without a
# real secret. In PRODUCTION this MUST be set via `wrangler secret put JWT_SECRET`
# (a secret binding overrides this [vars] value). Never ship this value.
[vars]
JWT_SECRET = "insecure-dev-placeholder"
